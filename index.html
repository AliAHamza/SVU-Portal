<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بوابة مقررات الفصل F25</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fb; --surface:#ffffff; --text:#1c2333; --muted:#6a7389;
  --primary:#1f5fd6; --border:#e2e6f0; --shadow:0 6px 20px rgba(31,50,100,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10141f; --surface:#1a2030; --text:#e8ecf6; --muted:#98a2bb;
    --primary:#5b8dee; --border:#2a3248; --shadow:0 6px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#10141f; --surface:#1a2030; --text:#e8ecf6; --muted:#98a2bb;
  --primary:#5b8dee; --border:#2a3248; --shadow:0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0}
body{
  font-family:'Cairo',Tahoma,Arial,sans-serif; background:var(--bg); color:var(--text);
  min-height:100vh; line-height:1.6;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
}
header{
  position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--border);
  padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem}
.logo{
  width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;color:#fff;
  background:linear-gradient(135deg,#1f5fd6,#1647a3);
}
.theme{
  border:1px solid var(--border);background:transparent;color:var(--text);
  width:40px;height:40px;border-radius:12px;cursor:pointer;font-size:18px;
}
.actions{display:flex;align-items:center;gap:8px}
.tool-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;
  padding:0 14px;border-radius:12px;background:var(--primary);color:#fff;
  font-weight:700;font-size:.9rem;text-decoration:none;white-space:nowrap;
  transition:filter .15s;
}
.tool-btn:hover,.tool-btn:focus-visible{filter:brightness(1.12);outline:none}
.tool-btn .ico{font-size:18px;line-height:1}
@media (max-width:520px){
  .tool-btn{width:40px;padding:0}
  .tool-btn .txt{display:none}
}
main{max-width:1100px;margin:0 auto;padding:24px 16px 40px}
.intro h2{font-size:1.5rem}
.intro p{color:var(--muted);margin:4px 0 20px}
.search{
  width:100%;max-width:420px;padding:12px 14px;border-radius:12px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);font:inherit;margin-bottom:20px;outline:none;
}
.search:focus{border-color:var(--primary)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;min-height:170px;padding:20px;border-radius:16px;
  background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);
  color:inherit;text-decoration:none;transition:transform .15s,border-color .15s;
}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--primary);outline:none}
.num{
  width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
  font-weight:700;color:#fff;background:var(--c);
}
.card h3{font-size:1.2rem;letter-spacing:.5px;direction:ltr;text-align:center}
.go{margin-top:4px;color:var(--primary);font-size:.88rem;font-weight:600}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.hidden{display:none}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:10px 16px 24px}
@media (max-width:480px){ .intro h2{font-size:1.25rem} .grid{gap:12px} }
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo">🎓</div><span>بوابة المقررات</span></div>
  <div class="actions">
    <a class="tool-btn" href="https://aliahamza.github.io/svu-lecture-Converter-mp4/" target="_blank" rel="noopener" title="محوّل المحاضرات إلى MP4" aria-label="محوّل المحاضرات إلى MP4"><span class="ico">🎬</span><span class="txt">محوّل المحاضرات</span></a>
    <button class="theme" id="themeBtn" title="تبديل المظهر" aria-label="تبديل المظهر">🌓</button>
  </div>
</header>

<main>
  <input class="search" id="search" type="search" placeholder="ابحث عن مقرر...">
  <div class="grid" id="grid"></div>
  <div class="empty hidden" id="empty">لا توجد نتائج</div>
</main>
<footer>الجامعة الافتراضية السورية – SVU</footer>

<script>
const BASE = "https://lms.svuonline.org/course/view.php?id=";
const COURSES = [
  { id: 1911, code: "SSE602" },
  { id: 1913, code: "SDB601" },
  { id: 1914, code: "SDBL601" },
  { id: 1924, code: "SSW601" },
  { id: 1910, code: "GET601" },
  { id: 1912, code: "SDA601" },
  { id: 1915, code: "Project 1" }
];
const COLORS = ["#1f5fd6","#0f9d8a","#c2410c","#7c3aed","#be185d","#0e7490","#4d7c0f"];
const $ = id => document.getElementById(id);

function render(){
  const q = $("search").value.trim().toLowerCase();
  const grid = $("grid"); grid.innerHTML = "";
  let shown = 0;
  COURSES.forEach((c,i) => {
    if(q && !c.code.toLowerCase().includes(q)) return;
    shown++;
    const a = document.createElement("a");
    a.className = "card"; a.href = BASE + c.id; a.target = "_blank"; a.rel = "noopener";
    a.style.setProperty("--c", COLORS[i % COLORS.length]);
    a.innerHTML = '<div class="num"></div><h3></h3><span class="go">فتح المقرر ←</span>';
    a.querySelector(".num").textContent = i + 1;
    a.querySelector("h3").textContent = c.code;
    grid.appendChild(a);
  });
  $("empty").classList.toggle("hidden", shown > 0);
}
$("search").addEventListener("input", render);

function getTheme(){ try{ return localStorage.getItem("svu_theme"); }catch(e){ return null; } }
function saveTheme(t){ try{ localStorage.setItem("svu_theme", t); }catch(e){} }
const saved = getTheme();
if(saved) document.documentElement.setAttribute("data-theme", saved);
$("themeBtn").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const t = dark ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", t); saveTheme(t);
};
render();
</script>
</body>
</html>
